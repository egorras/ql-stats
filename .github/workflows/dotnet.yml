name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install Aspire Workload
      run: dotnet workload install aspire

    - name: Restore dependencies
      run: dotnet restore qlstats.slnx

    - name: Build
      run: dotnet build qlstats.slnx --no-restore --configuration Release

    - name: Test
      run: dotnet test qlstats.slnx --no-build --configuration Release --verbosity normal
